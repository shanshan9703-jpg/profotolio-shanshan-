    &lt;!-- JAVASCRIPT --&gt;
    &lt;script&gt;
        document.addEventListener('DOMContentLoaded', () =&gt; {
            document.getElementById('current-year').textContent = new Date().getFullYear();

            const toastEl = document.getElementById('toast-notification');
            const toastMsg = document.getElementById('toast-message');
            let toastTimeout;

            function showToast(message) {
                toastMsg.textContent = message;
                toastEl.classList.remove('translate-y-24', 'opacity-0');
                toastEl.classList.add('translate-y-0', 'opacity-100');
                
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() =&gt; {
                    toastEl.classList.add('translate-y-24', 'opacity-0');
                    toastEl.classList.remove('translate-y-0', 'opacity-100');
                }, 3200);
            }

            function copyToClipboard(text, label) {
                const tempInput = document.createElement('textarea');
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand('copy');
                    showToast(`${label} berhasil disalin: ${text}`);
                } catch (err) {
                    showToast(`Gagal menyalin ${label}.`);
                }
                document.body.removeChild(tempInput);
            }

            const defaultProfile = {
                name: &quot;Shan Shan&quot;,
                role: &quot;Pelajar Desain Komunikasi Visual (DKV) &amp; Kreator Visual&quot;,
                status: &quot;Pelajar / Desainer DKV • Siap Kolaborasi Proyek&quot;,
                bio: &quot;Menggabungkan eksplorasi seni rupa, tipografi, dan media digital untuk menciptakan karya desain grafis, ilustrasi, serta antarmuka yang bercerita.&quot;,
                email: &quot;shanshan.dkv@student.id&quot;,
                phone: &quot;+62 813-9876-5432&quot;,
                location: &quot;Indonesia&quot;,
                avatar: &quot;https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=800&amp;q=80&quot;
            };

            let currentProfile = JSON.parse(localStorage.getItem('shanshan-portfolio-profile')) || { ...defaultProfile };

            function applyProfileToUI(data) {
                const firstName = data.name.trim().split(' ')[0] || 'S';
                document.getElementById('brand-initial').textContent = firstName.charAt(0).toUpperCase();
                document.getElementById('brand-first-name').textContent = firstName;
                
                document.getElementById('profile-name').textContent = data.name;
                document.getElementById('profile-role').textContent = data.role;
                document.getElementById('profile-status').textContent = data.status;
                document.getElementById('profile-bio').textContent = data.bio;
                document.getElementById('hero-email-label').textContent = data.email;
                
                if (data.avatar) {
                    document.getElementById('profile-avatar').src = data.avatar;
                }

                document.getElementById('contact-email-display').textContent = data.email;
                document.getElementById('contact-phone-display').textContent = data.phone;
                document.getElementById('contact-location-display').textContent = data.location;
                document.getElementById('footer-name').textContent = data.name;

                document.getElementById('cv-name').textContent = data.name;
                document.getElementById('cv-role').textContent = data.role;
                document.getElementById('cv-email').innerHTML = `&lt;i class=&quot;fa-solid fa-envelope mr-1.5 text-primary-600&quot;&gt;&lt;/i&gt;${data.email}`;
                document.getElementById('cv-phone').innerHTML = `&lt;i class=&quot;fa-solid fa-phone mr-1.5 text-primary-600&quot;&gt;&lt;/i&gt;${data.phone}`;
                document.getElementById('cv-location').innerHTML = `&lt;i class=&quot;fa-solid fa-location-dot mr-1.5 text-primary-600&quot;&gt;&lt;/i&gt;${data.location}`;
                document.getElementById('cv-bio').textContent = data.bio;
            }

            applyProfileToUI(currentProfile);

            document.getElementById('hero-copy-email-btn').addEventListener('click', () =&gt; {
                copyToClipboard(currentProfile.email, 'Alamat email');
            });
            document.getElementById('copy-email-btn').addEventListener('click', () =&gt; {
                copyToClipboard(currentProfile.email, 'Alamat email');
            });
            document.getElementById('copy-phone-btn').addEventListener('click', () =&gt; {
                copyToClipboard(currentProfile.phone, 'Nomor WhatsApp');
            });

            const editModal = document.getElementById('edit-profile-modal');
            const openEditBtn = document.getElementById('open-edit-profile-btn');
            const closeEditBtn = document.getElementById('close-edit-modal-btn');
            const cancelEditBtn = document.getElementById('cancel-edit-btn');
            const editForm = document.getElementById('edit-profile-form');
            const resetProfileBtn = document.getElementById('reset-profile-btn');

            function openEditModal() {
                document.getElementById('input-name').value = currentProfile.name;
                document.getElementById('input-role').value = currentProfile.role;
                document.getElementById('input-status').value = currentProfile.status;
                document.getElementById('input-bio').value = currentProfile.bio;
                document.getElementById('input-email').value = currentProfile.email;
                document.getElementById('input-phone').value = currentProfile.phone;
                document.getElementById('input-location').value = currentProfile.location;
                document.getElementById('input-avatar').value = currentProfile.avatar;

                editModal.classList.remove('hidden');
                editModal.classList.add('flex');
                document.body.style.overflow = 'hidden';
            }

            function closeEditModal() {
                editModal.classList.add('hidden');
                editModal.classList.remove('flex');
                document.body.style.overflow = '';
            }

            openEditBtn.addEventListener('click', openEditModal);
            closeEditBtn.addEventListener('click', closeEditModal);
            cancelEditBtn.addEventListener('click', closeEditModal);

            editForm.addEventListener('submit', (e) =&gt; {
                e.preventDefault();
                currentProfile = {
                    name: document.getElementById('input-name').value.trim(),
                    role: document.getElementById('input-role').value.trim(),
                    status: document.getElementById('input-status').value.trim(),
                    bio: document.getElementById('input-bio').value.trim(),
                    email: document.getElementById('input-email').value.trim(),
                    phone: document.getElementById('input-phone').value.trim(),
                    location: document.getElementById('input-location').value.trim(),
                    avatar: document.getElementById('input-avatar').value.trim() || defaultProfile.avatar
                };
                localStorage.setItem('shanshan-portfolio-profile', JSON.stringify(currentProfile));
                applyProfileToUI(currentProfile);
                closeEditModal();
                showToast('Profil Shan Shan berhasil diperbarui!');
            });

            resetProfileBtn.addEventListener('click', () =&gt; {
                currentProfile = { ...defaultProfile };
                localStorage.removeItem('shanshan-portfolio-profile');
                applyProfileToUI(currentProfile);
                closeEditModal();
                showToast('Profil dikembalikan ke pengaturan awal.');
            });

            const cvModal = document.getElementById('cv-modal');
            const openCvBtn = document.getElementById('open-cv-btn');
            const mobileCvBtn = document.getElementById('mobile-cv-btn');
            const closeCvBtn = document.getElementById('close-cv-modal-btn');
            const printCvBtn = document.getElementById('print-cv-btn');

            function openCvModal() {
                cvModal.classList.remove('hidden');
                cvModal.classList.add('flex');
                document.body.style.overflow = 'hidden';
            }

            function closeCvModal() {
                cvModal.classList.add('hidden');
                cvModal.classList.remove('flex');
                document.body.style.overflow = '';
            }

            openCvBtn.addEventListener('click', openCvModal);
            mobileCvBtn.addEventListener('click', () =&gt; {
                document.getElementById('mobile-menu').classList.add('hidden');
                openCvModal();
            });
            closeCvBtn.addEventListener('click', closeCvModal);
            printCvBtn.addEventListener('click', () =&gt; {
                window.print();
            });

            const themeToggleBtn = document.getElementById('theme-toggle');
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            const htmlElement = document.documentElement;

            const savedTheme = localStorage.getItem('shanshan-theme');
            if (savedTheme === 'dark' || (!savedTheme &amp;&amp; window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlElement.classList.add('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            }

            themeToggleBtn.addEventListener('click', () =&gt; {
                htmlElement.classList.toggle('dark');
                const isDark = htmlElement.classList.contains('dark');
                localStorage.setItem('shanshan-theme', isDark ? 'dark' : 'light');
                
                if (isDark) {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                } else {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                }
            });

            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            const mobileLinks = document.querySelectorAll('.mobile-link');

            mobileMenuBtn.addEventListener('click', () =&gt; {
                mobileMenu.classList.toggle('hidden');
            });

            mobileLinks.forEach(link =&gt; {
                link.addEventListener('click', () =&gt; {
                    mobileMenu.classList.add('hidden');
                });
            });

            // DATA PORTOFOLIO DKV SHAN SHAN
            const projects = [
                {
                    id: 1,
                    title: &quot;Poster Kampanye Lingkungan Hidup&quot;,
                    category: &quot;Desain Grafis&quot;,
                    year: &quot;2025&quot;,
                    client: &quot;Tugas Mata Pelajaran Komputer Grafis&quot;,
                    tools: [&quot;Adobe Photoshop&quot;, &quot;Adobe Illustrator&quot;],
                    image: &quot;https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&amp;fit=crop&amp;w=800&amp;q=80&quot;,
                    description: &quot;Perancangan poster kampanye 'Green Earth' dengan pendekatan visual minimalis, penekanan hierarki tipografi, dan pemilihan palet warna bumi (earth tones) yang ramah dipandang.&quot;
                },
                {
                    id: 2,

            const portfolioGrid = document.getElementById('portfolio-grid');
            const filterBtns = document.querySelectorAll('.filter-btn');

            function renderProjects(filter = 'all') {
                portfolioGrid.innerHTML = '';
                const filtered = filter === 'all' 
                    ? projects 
                    : projects.filter(p =&gt; p.category === filter);

                filtered.forEach(project =&gt; {
                    const card = document.createElement('article');
                    card.className = &quot;group bg-white dark:bg-slate-900 rounded-2xl overflow-hidden border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col&quot;;
                    card.innerHTML = `
                        &lt;div class=&quot;relative h-56 overflow-hidden bg-slate-200 dark:bg-slate-800&quot;&gt;
                            &lt;img 
                                src=&quot;${project.image}&quot; 
                                alt=&quot;${project.title}&quot; 
                                onerror=&quot;this.onerror=null; this.src='https://placehold.co/800x600/4f46e5/ffffff?text=${encodeURIComponent(project.title)}';&quot;
                                class=&quot;w-full h-full object-cover group-hover:scale-105 transition-transform duration-500&quot;
                            &gt;
                            &lt;div class=&quot;absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center&quot;&gt;
                                &lt;span class=&quot;px-4 py-2 rounded-xl bg-white/95 text-slate-900 text-xs font-bold shadow-md flex items-center gap-2&quot;&gt;
                                    &lt;i class=&quot;fa-solid fa-eye text-primary-600&quot;&gt;&lt;/i&gt; Lihat Detail Proyek
                                &lt;/span&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;p-6 flex-1 flex flex-col justify-between&quot;&gt;
                            &lt;div&gt;
                                &lt;div class=&quot;flex items-center justify-between gap-2 mb-2&quot;&gt;
                                    &lt;span class=&quot;text-xs font-semibold text-primary-600 dark:text-primary-400&quot;&gt;${project.category}&lt;/span&gt;
                                    &lt;span class=&quot;text-xs text-slate-400&quot;&gt;${project.year}&lt;/span&gt;
                                &lt;/div&gt;
                                &lt;h3 class=&quot;font-display font-bold text-lg text-slate-900 dark:text-white group-hover:text-primary-600 dark:group-hover:text-primary-400 transition-colors mb-2&quot;&gt;
                                    ${project.title}
                                &lt;/h3&gt;
                                &lt;p class=&quot;text-sm text-slate-600 dark:text-slate-400 line-clamp-2&quot;&gt;
                                    ${project.description}
                                &lt;/p&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                    `;

                    card.addEventListener('click', () =&gt; openProjectModal(project));
                    portfolioGrid.appendChild(card);
                });
            }

            filterBtns.forEach(btn =&gt; {
                btn.addEventListener('click', () =&gt; {
                    filterBtns.forEach(b =&gt; {
                        b.classList.remove('bg-primary-600', 'text-white', 'shadow-sm');
                        b.classList.add('bg-white', 'dark:bg-slate-900', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-slate-800');
                    });

                    btn.classList.remove('bg-white', 'dark:bg-slate-900', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-slate-800');
                    btn.classList.add('bg-primary-600', 'text-white', 'shadow-sm');

                    const selectedFilter = btn.getAttribute('data-filter');
                    renderProjects(selectedFilter);
                });
            });

            renderProjects('all');

            const modal = document.getElementById('project-modal');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const modalInquireBtn = document.getElementById('modal-inquire-btn');

            function openProjectModal(project) {
                document.getElementById('modal-image').src = project.image;
                document.getElementById('modal-category').textContent = project.category;
                document.getElementById('modal-year').textContent = project.year;
                document.getElementById('modal-title').textContent = project.title;
                document.getElementById('modal-description').textContent = project.description;
                document.getElementById('modal-client').textContent = project.client;

                const toolsContainer = document.getElementById('modal-tools');
                toolsContainer.innerHTML = '';
                project.tools.forEach(tool =&gt; {
                    const badge = document.createElement('span');
                    badge.className = 'px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700';
                    badge.textContent = tool;
                    toolsContainer.appendChild(badge);
                });

                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.style.overflow = 'hidden';
            }

            function closeProjectModal() {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.body.style.overflow = '';
            }

            closeModalBtn.addEventListener('click', closeProjectModal);
            modalInquireBtn.addEventListener('click', closeProjectModal);

            [modal, editModal, cvModal].forEach(m =&gt; {
                m.addEventListener('click', (e) =&gt; {
                    if (e.target === m) {
                        m.classList.add('hidden');
                        m.classList.remove('flex');
                        document.body.style.overflow = '';
                    }
                });
            });

            document.addEventListener('keydown', (e) =&gt; {
                if (e.key === 'Escape') {
                    [modal, editModal, cvModal].forEach(m =&gt; {
                        m.classList.add('hidden');
                        m.classList.remove('flex');
                    });
                    document.body.style.overflow = '';
                }
            });

            const contactForm = document.getElementById('contact-form');
            const formFeedback = document.getElementById('form-feedback');
            const feedbackText = document.getElementById('feedback-text');
            const submitBtn = document.getElementById('submit-btn');

            contactForm.addEventListener('submit', (e) =&gt; {
                e.preventDefault();
                const name = document.getElementById('sender-name').value.trim();
                const subject = document.getElementById('sender-subject').value;

                submitBtn.disabled = true;
                submitBtn.innerHTML = '&lt;i class=&quot;fa-solid fa-circle-notch fa-spin&quot;&gt;&lt;/i&gt; &lt;span&gt;Mengirim...&lt;/span&gt;';

                setTimeout(() =&gt; {
                    feedbackText.textContent = `Halo ${name}, pesan Anda mengenai &quot;${subject}&quot; telah diterima oleh ${currentProfile.name}.`;
                    formFeedback.classList.remove('hidden');
                    contactForm.reset();
                    showToast('Pesan berhasil terkirim!');

                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '&lt;span&gt;Kirim Pesan&lt;/span&gt; &lt;i class=&quot;fa-solid fa-paper-plane text-sm&quot;&gt;&lt;/i&gt;';

                    setTimeout(() =&gt; {
                        formFeedback.classList.add('hidden');
                    }, 7000);
                }, 700);
            });

            const revealElements = document.querySelectorAll('.reveal');
            const revealObserver = new IntersectionObserver((entries, observer) =&gt; {
                entries.forEach(entry =&gt; {
                    if (entry.isIntersecting) {
                        entry.target.classList.remove('opacity-0', 'translate-y-6');
                        entry.target.classList.add('opacity-100', 'translate-y-0');

                        const skillFills = entry.target.querySelectorAll('.skill-bar-fill');
                        skillFills.forEach(bar =&gt; {
                            bar.style.width = bar.getAttribute('data-width');
                        });

                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.12,
                rootMargin: '0px 0px -40px 0px'
            });

            revealElements.forEach(el =&gt; revealObserver.observe(el));
        });
    &lt;/script&gt;
